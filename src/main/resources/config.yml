# Walls - configuration
#
# The arena is rebuilt from these values by /walls reset, so changing a number
# here and rebuilding is all it takes to reshape the map.

arena:
  # A dedicated world is created automatically. It is generated empty; the
  # platform below is painted into it.
  world: walls_arena
  center-x: 0
  center-z: 0

  # Y of the grass surface everyone plays on.
  floor-y: 64

  # How deep the platform is, in blocks. Laid out top-down as
  # 1 grass, 4 dirt, then stone, then 1 bedrock - so most of this depth is solid
  # stone, which is where caves and ore can be carved in later.
  thickness: 50

  # Block changes per tick while building. Higher rebuilds faster but costs more
  # per tick; the default keeps a full rebuild at a couple of seconds with no
  # visible lag.
  blocks-per-tick: 20000

  glass:
    # Height of the glass shell above the floor. Must be greater than the wall
    # height, or the walls could be climbed out of.
    height: 40
    material: GLASS

walls:
  material: SANDSTONE

  # Width of each wall arm. Must be an odd number so it has a centre.
  thickness: 3

  # Walls run the full depth of the platform as well as standing above it, so
  # nobody can dig underneath them. Building is capped three blocks below the
  # top while they stand, so nobody can pillar up and walk over them either.
  # Height and vault radius are set per mode, below.

  # How long the walls take to rise or fall, in ticks (20 ticks = 1 second).
  fall-ticks: 40

caves:
  # Caves and ore are carved into the stone body of the platform - the reason
  # the platform is fifty blocks deep. Carving never touches a wall column or
  # anything within wall-margin of one, so tunnelling between sectors stays
  # impossible.
  enabled: true

  # 0 picks a fresh seed on every rebuild. Set a number for a repeatable map.
  seed: 0

  # How many tunnels to dig, and how far each one runs.
  tunnels: 26
  tunnel-length: 160

  # How far carving must stay clear of any wall.
  wall-margin: 3

  # Loot chests hidden in the caves.
  chests: 6

bases:
  pedestal-material: STONE_BRICKS

center:
  # Loot chests inside the vault.
  chests: 8
  # Distance from the centre the chests are arranged at. Must be less than
  # walls.vault-radius.
  ring-radius: 3

# Named game modes. Switch with /walls mode <name>.
#
#   teams            any count from 2 up
#   shape            SQUARE, CIRCLE, or auto (four teams square, others circle -
#                    a square cannot be split into five equal sectors)
#   radius           half-width; the map is (2 * radius + 1) blocks across
#   players-per-team what the mode is sized for
#   base-offset      distance from centre to each base; 0 works it out
#   vault-radius     more teams need a bigger vault, or the walls merge at the
#                    centre. The plugin says so at startup if they would.
modes:
  mega:
    teams: 4
    shape: SQUARE
    radius: 100
    players-per-team: 25
    wall-height: 16
    vault-radius: 8
    grace-seconds: 300
  large:
    teams: 5
    shape: CIRCLE
    radius: 80
    players-per-team: 12
    wall-height: 15
    vault-radius: 8
    grace-seconds: 240
  small:
    teams: 4
    shape: SQUARE
    radius: 60
    players-per-team: 6
    wall-height: 14
    vault-radius: 6
    grace-seconds: 180
  duel:
    teams: 2
    shape: CIRCLE
    radius: 30
    players-per-team: 1
    wall-height: 12
    vault-radius: 6
    grace-seconds: 90

default-mode: small

# One arena per world. With a single arena the world keeps the plain name above;
# with several, each gets the name suffixed (walls_arena_main, walls_arena_duel).
# Set 'world' on an arena to place it in a specific world instead. Two arenas
# may not share a world - the plugin refuses to start if they do.
arenas:
  main:
    mode: small
  # second:
  #   mode: duel
  #   world: walls_duel

stats:
  # Per-player matches, wins, kills, deaths and wool broken, kept in stats.yml.
  enabled: true

objective:
  # The "1000 health" wool block each team must defend.
  max-health: 1000
  # Health removed per break attempt. 1000 / 50 = 20 breaks to destroy.
  damage-per-break: 50

game:
  countdown-seconds: 15
  # How long teams have behind the walls is set per mode, above.
  # Time spent as a spectator before respawning, while the team's wool stands.
  respawn-seconds: 5
  # How long the winner is shown before the arena rebuilds.
  end-seconds: 10
